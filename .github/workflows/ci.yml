name: CI

# Runs on every push to main (which is what triggers the Cloudflare Pages
# deploy) and on PRs, so site breakage is caught with every deployment.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Site smoke tests
        run: npm test
      - name: Typecheck Pages Functions (informational — pre-existing errors)
        run: npm run typecheck
        continue-on-error: true

name: Radar scan runner

# Cloudflare Pages does not run wrangler cron triggers, so we drive the Radar
# scan pipeline by pinging the run endpoint on a schedule. (GitHub cron is
# best-effort, ~5 min minimum and can lag a few min under load — for a tighter
# SLA point a dedicated cron service, e.g. cron-job.org, at the same endpoint.)
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}        # allow manual runs from the Actions tab

concurrency:
  group: radar-cron
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Process queued Radar scan jobs
        run: |
          curl -fsS -X POST "https://www.revforgehq.com/api/radar/run?max=5" \
            -H "Authorization: Bearer ${{ secrets.RADAR_RUNNER_KEY }}" \
            -H "Content-Type: application/json" | tee /dev/stderr

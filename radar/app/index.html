<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<meta name="robots" content="noindex">
<title>Your reports · RevForgeHQ Radar</title>
<style>
  :root{--bg:#0b0e14;--panel:#121723;--panel2:#1a2130;--line:#232c3f;--line2:#2c3650;--txt:#e8edf6;--mut:#8b97ad;
        --acc:#ff6b35;--acc2:#ffa06b;--gold:#d4b878;--good:#34d399;--bad:#f87171;
        --serif:Georgia,'EB Garamond',serif;--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:var(--sans);min-height:100vh;
       background-image:radial-gradient(900px 440px at 50% -8%,rgba(255,107,53,.09),transparent 60%)}
  .wrap{max-width:1180px;margin:0 auto;padding:22px 22px 48px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
  .brand{display:inline-flex;align-items:center;gap:9px;font-family:var(--serif);font-size:19px;font-weight:700}
  .brand i{font-style:italic;color:var(--gold)}
  .brand .pill{font-family:var(--sans);font-size:9.5px;font-weight:800;letter-spacing:.12em;color:var(--acc);
       border:1px solid rgba(255,107,53,.35);background:rgba(255,107,53,.08);padding:3px 7px;border-radius:99px}
  .nav{display:flex;align-items:center;gap:6px}
  .nav a,.nav button{font-family:inherit;font-size:13px;font-weight:600;color:var(--mut);background:transparent;border:1px solid transparent;
       padding:8px 13px;border-radius:9px;cursor:pointer;text-decoration:none}
  .nav a:hover,.nav button:hover{color:var(--txt)}
  .nav a.active{color:var(--txt);border-color:var(--line2);background:var(--panel)}
  .hello{margin-bottom:18px}
  .hello h1{font-size:23px;font-weight:800;letter-spacing:-.02em}
  .hello p{color:var(--mut);font-size:14px;margin-top:5px}
  .badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
         padding:3px 9px;border-radius:99px;border:1px solid var(--line2);color:var(--gold);margin-left:8px}
  .banner{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px;
          background:linear-gradient(180deg,rgba(255,107,53,.10),rgba(255,107,53,.04));border:1px solid rgba(255,107,53,.4);border-radius:12px;padding:14px 18px}
  .banner .bt{font-size:14px;color:var(--mut)}.banner .bt b{color:var(--txt)}
  .banner a.up{background:linear-gradient(100deg,var(--acc),#ff8a4d);color:#1a0e06;font-weight:700;font-size:13px;
          padding:9px 16px;border-radius:9px;text-decoration:none;white-space:nowrap}
  .grid{display:grid;grid-template-columns:268px 1fr;gap:18px;align-items:start}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .rail{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;max-height:80vh;overflow:auto}
  .rail h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:800;padding:6px 8px 10px}
  .ri{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:10px;
      padding:11px 12px;cursor:pointer;font-family:inherit;color:var(--txt);margin-bottom:4px;transition:.12s}
  .ri:hover{background:var(--panel2)}
  .ri.active{background:var(--panel2);border-color:rgba(255,107,53,.4)}
  .ri .t{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .ri .nm{font-size:13.5px;font-weight:700}
  .ri .rate{font-size:13px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
  .ri .d{font-size:11.5px;color:var(--mut);margin-top:3px}
  .ri .tag{font-size:9.5px;font-weight:700;color:var(--mut);border:1px solid var(--line2);border-radius:99px;padding:1px 6px;margin-left:6px}
  .ri.latest .nm::after{content:"LATEST";font-size:9px;font-weight:800;letter-spacing:.06em;color:var(--acc2);
       border:1px solid rgba(255,107,53,.4);border-radius:99px;padding:1px 6px;margin-left:7px;vertical-align:middle}
  .viewer{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-height:80vh}
  .vbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .vbar .vt{font-size:14.5px;font-weight:700}
  .vbar .vt .vd{color:var(--mut);font-weight:500;font-size:12.5px;margin-left:8px}
  .vbar a{font-size:13px;font-weight:700;color:var(--acc2);text-decoration:none;white-space:nowrap}
  .vbar a:hover{color:var(--acc)}
  iframe{width:100%;flex:1;border:0;background:#0b0e14;min-height:74vh}
  .empty,.loading{text-align:center;color:var(--mut);background:var(--panel);border:1px dashed var(--line2);border-radius:16px;padding:54px 24px}
  .empty h2{color:var(--txt);font-size:19px;font-weight:800;margin-bottom:10px}
  .empty .dot{width:10px;height:10px;border-radius:99px;background:var(--acc);display:inline-block;margin-right:8px;animation:pulse 1.6s infinite}
  @keyframes pulse{0%{opacity:.4}50%{opacity:1}100%{opacity:.4}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <span class="brand"><span class="wm">Rev<i>Forge</i>HQ</span> <span class="pill">RADAR</span></span>
      <nav class="nav">
        <a href="/radar/app/" class="active">Reports</a>
        <a href="/radar/settings/">Settings</a>
        <button id="logout">Sign out</button>
      </nav>
    </div>
    <div id="content"><div class="loading">Loading your reports…</div></div>
  </div>
<script>
  const content=document.getElementById('content');
  document.getElementById('logout').addEventListener('click',async()=>{try{await fetch('/api/radar/logout',{method:'POST'});}catch(_){}location.href='/radar/login';});
  function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
  function fmtDate(s){try{return new Date(s).toLocaleString(undefined,{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});}catch(_){return s;}}
  function fmtShort(s){try{return new Date(s).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}catch(_){return s;}}
  const kindLabel={first_scan:'First report',daily:'Daily report',weekly:'Weekly report'};
  function trialDays(end){if(!end)return null;const d=Math.ceil((new Date(end)-new Date())/86400000);return d>0?d:0;}
  function repUrl(r){return '/api/radar/report?id='+encodeURIComponent(r.id)+'&t='+encodeURIComponent(r.view_token);}

  (async()=>{
    let res;
    try{res=await fetch('/api/radar/reports',{headers:{'Accept':'application/json'}});}
    catch(_){content.innerHTML='<div class="empty"><h2>Something went wrong</h2><p>Please refresh in a moment.</p></div>';return;}
    if(res.status===401){location.href='/radar/login';return;}
    const data=await res.json().catch(()=>({}));
    if(!res.ok||!data.ok){content.innerHTML='<div class="empty"><h2>Something went wrong</h2><p>'+esc(data.error||'Please try again.')+'</p></div>';return;}

    const a=data.account||{}, reps=data.reports||[];
    const planLabel=a.plan==='free'?'Free':(a.plan==='pro_trial'?'Pro trial':(a.plan||'').replace(/^\w/,c=>c.toUpperCase()));
    const days=trialDays(a.trial_ends_at);
    const first=(a.full_name||'').trim().split(/\s+/)[0]||'there';
    const head='<div class="hello"><h1>Welcome back, '+esc(first)+'<span class="badge">'+esc(planLabel)+
      (a.plan!=='free'&&days!=null?' · '+days+'d left':'')+'</span></h1>'+
      '<p>'+(a.brand_name?'Tracking <b style="color:var(--txt)">'+esc(a.brand_name)+'</b>':'Your brand')+
      ' across ChatGPT, Perplexity, Gemini and Google AI Overviews.</p></div>';

    const banner=a.trial_expired_at
      ? '<div class="banner"><div class="bt"><b>Your 7-day Pro trial ended.</b> You\'re on the Free plan now — a weekly scan on one engine. Upgrade to restore daily reports across all four engines.</div><a class="up" href="/radar/#pricing">Upgrade →</a></div>'
      : '';

    if(!reps.length){
      content.innerHTML=head+banner+'<div class="empty"><h2><span class="dot"></span>Your first report is on its way</h2>'+
        '<p>We\'re running your first AI-visibility scan now — usually ready within 30 minutes. You\'ll get an email the moment it\'s ready, and it\'ll appear here.</p></div>';
      return;
    }

    const items=reps.map((r,i)=>{
      const rate=(r.mention_rate!=null)?Number(r.mention_rate).toFixed(0)+'%':'—';
      const mock=r.is_mock?'<span class="tag">sample</span>':'';
      return '<button class="ri'+(i===0?' latest':'')+'" data-i="'+i+'">'+
        '<div class="t"><span class="nm">'+esc(kindLabel[r.kind]||r.kind||'Report')+mock+'</span><span class="rate">'+rate+'</span></div>'+
        '<div class="d">'+fmtShort(r.created_at)+'</div></button>';
    }).join('');

    content.innerHTML=head+banner+'<div class="grid">'+
      '<aside class="rail"><h2>History · '+reps.length+'</h2>'+items+'</aside>'+
      '<section class="viewer"><div class="vbar"><div class="vt" id="vt"></div><a id="vopen" target="_blank" rel="noopener">Open in new tab ↗</a></div>'+
      '<iframe id="vframe" title="Report"></iframe></section></div>';

    const frame=document.getElementById('vframe'), vt=document.getElementById('vt'), vopen=document.getElementById('vopen');
    function select(i){
      const r=reps[i]; if(!r)return;
      frame.src=repUrl(r); vopen.href=repUrl(r);
      vt.innerHTML=esc((a.brand_name?a.brand_name+' ':'')+(kindLabel[r.kind]||r.kind||'Report'))+'<span class="vd">'+fmtDate(r.created_at)+'</span>';
      content.querySelectorAll('.ri').forEach(b=>b.classList.toggle('active',+b.dataset.i===i));
    }
    content.querySelectorAll('.ri').forEach(b=>b.addEventListener('click',()=>select(+b.dataset.i)));
    select(0); // latest first
  })();
</script>
</body>
</html>

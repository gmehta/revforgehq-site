<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<meta name="robots" content="noindex">
<title>Set a new password · RevForgeHQ Radar</title>
<style>
  :root{--bg:#0b0e14;--panel:#121723;--panel2:#1a2130;--line:#232c3f;--line2:#2c3650;--txt:#e8edf6;--mut:#8b97ad;
        --acc:#ff6b35;--gold:#d4b878;--good:#34d399;--bad:#f87171;
        --serif:Georgia,'EB Garamond',serif;--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:var(--sans);min-height:100vh;display:grid;place-items:center;padding:24px;
       background-image:radial-gradient(700px 400px at 50% -5%,rgba(255,107,53,.14),transparent 60%)}
  .card{max-width:420px;width:100%;background:linear-gradient(180deg,var(--panel),#0f141e);border:1px solid var(--line);
        border-radius:20px;padding:36px 32px;box-shadow:0 30px 80px -30px rgba(0,0,0,.8)}
  .brand{display:inline-flex;align-items:center;gap:9px;font-family:var(--serif);font-size:19px;font-weight:700;margin-bottom:22px}
  .brand i{font-style:italic;color:var(--gold)}
  .brand .pill{font-family:var(--sans);font-size:9.5px;font-weight:800;letter-spacing:.12em;color:var(--acc);
       border:1px solid rgba(255,107,53,.35);background:rgba(255,107,53,.08);padding:3px 7px;border-radius:99px}
  h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
  .sub{color:var(--mut);font-size:14px;margin-bottom:24px}
  label{display:block;font-size:12.5px;font-weight:700;color:var(--mut);margin:0 0 7px;letter-spacing:.02em}
  input{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:11px;padding:13px 14px;color:var(--txt);
        font-size:15px;font-family:inherit;outline:none;margin-bottom:16px;transition:.15s}
  input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,107,53,.12)}
  .btn{width:100%;font-weight:700;font-size:15px;padding:14px;border:0;border-radius:11px;cursor:pointer;font-family:inherit;
       background:linear-gradient(100deg,var(--acc),#ff8a4d);color:#1a0e06;box-shadow:0 6px 22px rgba(255,107,53,.28)}
  .btn:disabled{opacity:.6;cursor:default}
  .msg{font-size:13.5px;margin-bottom:14px;display:none}
  .msg.show{display:block}
  .msg.ok{color:var(--good)} .msg.err{color:var(--bad)}
  .foot{color:var(--mut);font-size:13px;margin-top:20px;text-align:center}
  .foot a{color:var(--acc);text-decoration:none;font-weight:600}
</style>
</head>
<body>
  <div class="card">
    <span class="brand">Rev<i>Forge</i>HQ <span class="pill">RADAR</span></span>
    <h1>Set a new password</h1>
    <p class="sub">Choose a new password for your account.</p>
    <div class="msg" id="msg"></div>
    <form id="form">
      <label for="password">New password</label>
      <input id="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" required>
      <label for="confirm">Confirm new password</label>
      <input id="confirm" type="password" autocomplete="new-password" placeholder="Re-enter password" required>
      <button class="btn" id="submit" type="submit">Update password →</button>
    </form>
    <p class="foot"><a href="/radar/login">← Back to sign in</a></p>
  </div>
<script>
  const token=new URLSearchParams(location.search).get('token')||'';
  const form=document.getElementById('form'), msg=document.getElementById('msg'), btn=document.getElementById('submit');
  function show(text,ok){msg.textContent=text;msg.className='msg show '+(ok?'ok':'err');}
  if(!token){show('This reset link is missing its token. Request a new one from the sign-in page.',false);btn.disabled=true;}
  form.addEventListener('submit',async(e)=>{
    e.preventDefault();
    const pw=document.getElementById('password').value, cf=document.getElementById('confirm').value;
    if(pw.length<8){show('Password must be at least 8 characters.',false);return;}
    if(pw!==cf){show('Passwords do not match.',false);return;}
    btn.disabled=true;const label=btn.textContent;btn.textContent='Updating…';
    try{
      const res=await fetch('/api/radar/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:pw})});
      const data=await res.json().catch(()=>({}));
      if(res.ok&&data.ok){show('Password updated. Redirecting to sign in…',true);setTimeout(()=>location.href='/radar/login',1400);return;}
      show(data.error||'Could not reset your password.',false);
      btn.disabled=false;btn.textContent=label;
    }catch(_){show('Something went wrong. Please try again.',false);btn.disabled=false;btn.textContent=label;}
  });
</script>
</body>
</html>

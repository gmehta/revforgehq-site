<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
<meta name="robots" content="noindex">
<title>Welcome to RevForgeHQ Radar</title>
<style>
  :root{--bg:#0b0e14;--panel:#121723;--panel2:#1a2130;--line:#232c3f;--txt:#e8edf6;--mut:#8b97ad;
        --acc:#ff6b35;--gold:#d4b878;--good:#34d399;--bad:#f87171;
        --serif:Georgia,'EB Garamond',serif;--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:var(--sans);min-height:100vh;display:grid;place-items:center;padding:24px;
       background-image:radial-gradient(700px 400px at 50% -5%,rgba(255,107,53,.14),transparent 60%)}
  .card{max-width:520px;width:100%;background:linear-gradient(180deg,var(--panel),#0f141e);border:1px solid var(--line);
        border-radius:20px;padding:40px 34px;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.8)}
  .brand{display:inline-flex;align-items:center;gap:9px;font-family:var(--serif);font-size:19px;font-weight:700;margin-bottom:26px}
  .brand i{font-style:italic;color:var(--gold)}
  .brand .pill{font-family:var(--sans);font-size:9.5px;font-weight:800;letter-spacing:.12em;color:var(--acc);
       border:1px solid rgba(255,107,53,.35);background:rgba(255,107,53,.08);padding:3px 7px;border-radius:99px}
  .icon{width:78px;height:78px;border-radius:99px;margin:0 auto 22px;display:grid;place-items:center;font-size:38px}
  .icon.ok{background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.4);color:var(--good)}
  .icon.err{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.4);color:var(--bad)}
  h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-bottom:12px}
  p{color:var(--mut);font-size:15px;line-height:1.6;margin-bottom:10px}
  p b{color:var(--txt)}
  .meta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:24px 0}
  .tm{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px 16px;min-width:104px}
  .tm .v{font-size:18px;font-weight:800;color:var(--gold)}
  .tm .l{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin-top:3px}
  .btn{display:inline-block;margin-top:14px;font-weight:700;font-size:15px;padding:13px 26px;border-radius:11px;
       background:linear-gradient(100deg,var(--acc),#ff8a4d);color:#1a0e06;text-decoration:none;
       box-shadow:0 6px 22px rgba(255,107,53,.28)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt);box-shadow:none}
  a.small{color:var(--mut);font-size:13px;text-decoration:none}a.small:hover{color:var(--txt)}
</style>
</head>
<body>
  <div class="card">
    <span class="brand">Rev<i>Forge</i>HQ <span class="pill">RADAR</span></span>
    <div id="content"></div>
  </div>
<script>
  const q=new URLSearchParams(location.search);
  const status=q.get('status');
  const brand=q.get('brand');
  const reason=q.get('reason');
  const reasons={
    'missing-token':"This confirmation link is missing its token.",
    'expired':"This link has expired or was already used. Confirmation links are valid for 24 hours.",
    'not-found':"We couldn't find an account for this link.",
    'not-configured':"Email confirmation isn't available right now. Please contact support.",
    'server-error':"Something went wrong on our side. Please try again in a moment."
  };
  const el=document.getElementById('content');
  if(status==='ok'){
    el.innerHTML=`
      <div class="icon ok">✓</div>
      <h1>You're in${brand?` — welcome, ${brand}`:''}.</h1>
      <p>Your <b>7-day Pro trial</b> is active and your first AI-visibility scan is queued. We'll email you the moment your report is ready — usually within minutes.</p>
      <div class="meta">
        <div class="tm"><div class="v">7 days</div><div class="l">Pro access</div></div>
        <div class="tm"><div class="v">4</div><div class="l">Engines</div></div>
        <div class="tm"><div class="v">Daily</div><div class="l">Scans</div></div>
      </div>
      <a class="btn" href="/radar/#report">Preview a sample report →</a>
      <p style="margin-top:18px"><a class="small" href="https://www.revforgehq.com">← Back to RevForgeHQ</a></p>`;
  }else{
    el.innerHTML=`
      <div class="icon err">!</div>
      <h1>We couldn't confirm that link</h1>
      <p>${reasons[reason]||"This confirmation link is invalid."}</p>
      <a class="btn ghost" href="/radar/#start">Start a new trial →</a>
      <p style="margin-top:18px"><a class="small" href="https://www.revforgehq.com/#contact">Contact support</a></p>`;
  }
</script>
</body>
</html>
